- aid: respeecher:respeecher-space-realtime-tts-api
  name: Respeecher Space Real-Time TTS API
  tags:
  - Real-Time
  - Streaming
  - WebSocket
  - Text-to-Speech
  tags_raw:
  - Real Time
  - Streaming
  - WebSocket
  - Text to Speech
  image: https://kinlane-images.s3.amazonaws.com/shared/apis-json/apis-json-logo.jpg
  humanURL: https://space.respeecher.com/docs
  baseURL: https://api.respeecher.com/v1/public/tts/en-rt
  properties:
  - url: https://space.respeecher.com/docs/quickstart
    type: Documentation
  - url: https://space.respeecher.com/docs/api/tts/web-socket
    type: APIReference
  - url: asyncapi/respeecher-asyncapi.yml
    type: AsyncAPI
  - url: https://www.respeecher.com/real-time-tts-api
    type: SignUp
  description: >-
    Low-latency real-time text-to-speech that begins streaming audio in under 200ms via three transports
    - one-shot bytes (POST /tts/bytes, up to ~5,000 characters), HTTP SSE chunks (POST /tts/sse), and
    a bidirectional WebSocket channel (wss://api.respeecher.com/v1/public/tts/en-rt, GET /tts/websocket)
    that streams input text and output audio keyed by context_id. English (en-rt) and Ukrainian (ua-rt)
    models, X-API-Key auth, official Python and TypeScript SDKs, and LiveKit, Pipecat, Ultravox, and VAPI
    integrations.
